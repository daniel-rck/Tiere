<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: without it env(safe-area-inset-*) is 0 on iOS and
         the notch and home-indicator padding does nothing. No page zoom: pinch
         belongs to the photo viewer (spec 3.3, 8). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Echte Tierfotos für Kinder ab 2: tippen, Name und Tierlaut hören – offline."
    />
    <meta name="theme-color" content="#a71f65" />
    <title>Tiere</title>
    <!-- Before the stylesheet: applies a forced light/dark choice before first paint. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
