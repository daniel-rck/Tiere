name: Sound candidates

# Runs sounds:candidates --all on a GitHub runner (Wikimedia rate-limits the
# agent environment) and uploads .cache/sounds (previews, JSON, listening
# sheets) as a workflow artifact for the selection (spec 5.5, Mensch-Gate).
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - scripts/sounds-candidates.ts
      - scripts/sound-filter.ts
      - .github/workflows/sound-candidates.yml

permissions:
  contents: read

jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - run: bun install --frozen-lockfile
      - run: bun run sounds:candidates --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sound-candidates
          path: .cache/sounds
          retention-days: 14
