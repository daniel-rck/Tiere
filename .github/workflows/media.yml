name: Media

# Builds the selected photos and sounds (photos:build, sounds:build) on a GitHub
# runner and commits the result to the branch. For when Wikimedia rate-limits
# the machine that would otherwise run the build (spec, decision log). Runs when
# the selection or a build script changes (not on main), or by hand.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - content/animals.json
      - scripts/commons.ts
      - scripts/photos-build.ts
      - scripts/sounds-build.ts
      - scripts/sounds.ts
      - .github/workflows/media.yml

permissions:
  contents: write

concurrency:
  group: media-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - run: bun install --frozen-lockfile
      # Keep what was built even if some downloads failed; fail the job at the end.
      - id: photos
        run: bun run photos:build
        continue-on-error: true
      - id: sounds
        run: bun run sounds:build
        continue-on-error: true
      - run: bun run content:check
      - name: Commit media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/photos public/sounds src/content/catalog.generated.json \
            src/content/credits.generated.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore(content): build photos and sounds"
            git pull --rebase
            git push
          fi
      - if: steps.photos.outcome == 'failure' || steps.sounds.outcome == 'failure'
        run: |
          echo "A build did not finish; run the workflow again."
          exit 1
